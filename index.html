<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Print</title>
    <!-- Other head elements -->
    <script src="products.js"></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="boost.html">Boost TikTok</a></li>
            <!-- Other nav links -->
        </ul>
    </nav>

    <div class="boost-banner">
        <h2>Boost Your Presence!</h2>
        <a href="boost.html" class="button">Learn More</a>
    </div>

    <script>
        const products = [
            { id: "123456", name: "Product 1", affiliateLink: "https://rzekl.com/g/1e8d114494ffc29cecab16525dc3e8/?ulp=https://www.aliexpress.com/item/123456.html" },
            { id: "654321", name: "Product 2", affiliateLink: "https://rzekl.com/g/1e8d114494ffc29cecab16525dc3e8/?ulp=https://www.aliexpress.com/item/654321.html" }
            // Add more products as needed
        ];

        function renderProducts() {
            const productContainer = document.getElementById('product-container');
            products.forEach(product => {
                const productElement = document.createElement('a');
                productElement.href = product.affiliateLink;
                productElement.innerText = product.name;
                productContainer.appendChild(productElement);
            });
        }

        // Call the function when the document is ready
        document.addEventListener('DOMContentLoaded', renderProducts);
    </script>

    <!-- Keep existing code for hamburger, cookies, and country detection -->
</body>
</html>
